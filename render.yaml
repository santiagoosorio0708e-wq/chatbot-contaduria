services:
  - type: web
    name: chatbot-contaduria
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: TIMEZONE
        value: America/Bogota
      - key: ENABLE_SCHEDULE_RESTRICTION
        value: "true"
      - key: OFF_HOURS_COOLDOWN_MINUTES
        value: "60"
      - key: USE_PAIRING_CODE
        value: "false"
      - key: PHONE_NUMBER
        sync: false

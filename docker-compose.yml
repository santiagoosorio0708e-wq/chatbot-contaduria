services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatbot-contador:latest
    container_name: chatbot-contador
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./.wwebjs_cache:/app/.wwebjs_cache

